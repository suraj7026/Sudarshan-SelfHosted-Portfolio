services:
  frontend:
    build: ./frontend
    restart: always

  backend:
    build: ./backend
    restart: always
    ports:
      - "8080:8080" # Backend also exposed internally
    environment:
      - DATABASE_URL=${DATABASE_URL}

  gateway:
    image: nginx:alpine
    restart: always
    ports:
      - "3000:80" # Cloudflare Tunnel hits this!
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend

  resume-worker:
    build: ./resume-worker
    container_name: resume-processor
    restart: always
    network_mode: host
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-http://127.0.0.1:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - BUCKET_NAME=surajwebsite
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.1-flash-lite-preview}
    volumes:
      - resume-jobs:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=15)"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s

  umami-db:
    image: postgres:15-alpine
    container_name: umami-db
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: umami
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    restart: always

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: umami
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://umami:umami@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET:-replace_me_with_a_secure_random_string}
    depends_on:
      - umami-db
    restart: always

volumes:
  umami-db-data:
  resume-jobs:
