services:
  frontend:
    build: ./frontend
    restart: always

  backend:
    build: ./backend
    restart: always
    ports:
      - "8080:8080" # Backend also exposed internally
    environment:
      - DATABASE_URL=${DATABASE_URL}

  gateway:
    image: nginx:alpine
    restart: always
    ports:
      - "3000:80" # Cloudflare Tunnel hits this!
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend

  resume-worker:
    build: ./resume-worker
    container_name: resume-processor
    restart: always
    ports:
      - "5000:5000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - MINIO_ENDPOINT=http://172.17.0.1:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - BUCKET_NAME=surajwebsite
